// Applied by gtnhgradle's AddonScriptModule alongside the standard convention scripts.

test {
    // The layout benchmark (tag bench) runs only when asked: ./gradlew test -Pbench=<label> --tests '*LayoutBenchmark*'
    useJUnitPlatform {
        if (!project.hasProperty('bench')) excludeTags 'bench'
    }
    systemProperty 'gtnhplanner.bench', project.findProperty('bench') ?: ''
    for (String k : ['near', 'wide', 'run', 'turn45', 'turn90', 'cross', 'nearCost', 'rounds']) if (project.hasProperty('router.' + k)) systemProperty 'gtnhplanner.router.' + k, project.property('router.' + k)
    systemProperty 'java.awt.headless', 'true'
    if (project.hasProperty('crop')) systemProperty 'gtnhplanner.crop', project.property('crop')
    if (project.hasProperty('benchOnly')) systemProperty 'gtnhplanner.bench.only', project.property('benchOnly')
    if (project.hasProperty('profileBoard')) systemProperty 'gtnhplanner.profile.board', project.property('profileBoard')
    if (project.hasProperty('jfr')) jvmArgs '-XX:StartFlightRecording=filename=build/bench/profile.jfr,settings=profile'
    // GTNHGradle points this task at the downgraded test classes. On a clean build the configuration cache
    // captures that directory while it is still empty, and the task then reports NO-SOURCE and runs nothing.
    notCompatibleWithConfigurationCache('downgraded test classes are captured empty on clean builds')
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'short'
    }
}

// The shaded ELK distribution ships its documentation-site illustrations (images/**), EMF
// design-time metamodels (model/** and schema/**), Eclipse plugin descriptors, and docs;
// all dead weight at runtime, and the descriptors would sit at the jar's top level.
tasks.matching { it.name == 'shadowJar' }.configureEach {
    // Three ELK jars each declare an ILayoutMetaDataProvider service. Without this, shadow keeps
    // one of the three and leaves its filename and contents on the original package names, so a
    // ServiceLoader in the relocated ELK finds nothing - in the shipped jar only, never in dev.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    exclude 'images/**'
    exclude 'model/**'
    exclude 'schema/**'
    exclude 'docs/**'
    exclude 'about.*'
    exclude 'plugin.xml'
    exclude 'plugin.properties'
    exclude 'modeling32.png'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
}

// ELK declares guava as the open range [15.0,), which re-resolves to the newest guava on
// every fresh resolution - unreproducible builds and a needlessly fat shaded jar. Pin the
// ELK-0.8-era release. Scoped to the shadow configurations so the dev/runtime classpath
// (which must keep Minecraft's guava) is untouched.
configurations.matching { it.name.toLowerCase(Locale.ROOT).contains('shadow') }.configureEach {
    resolutionStrategy.force('com.google.guava:guava:30.1-jre')
}
